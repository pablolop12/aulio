<div class="base">
  <div class="background">
    <img class="orange" src="img/naranja.webp" alt="Naranja">
    <img class="yellow" src="img/amarillo.webp" alt="Amarillo">
  </div>
  <div class="logo">
    <h1>AÜLIO</h1>
    <span class="copy">©</span>
  </div>
  <div class="base-block block-padding">



    <div class="login-card">
      <div class="tittle">
        <h1>Inicio de sesión</h1>
        <p>Introduce tus credenciales para acceder al panel de usuario.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="Introduce tu email" />
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Introduce tu contraseña" />
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="login-extras">
          <div class="stay-logged">
            <input type="checkbox" class="logged-checkbox" id="cbox2" value="second_checkbox" />
            <label for="cbox2">Mantener sesión iniciada</label>
          </div>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="login-button" type="submit" [disabled]="loginForm.invalid">
          Iniciar sesión
        </button>

      </form>

      <a href="#" class="request">¿Nuevo usuario? <strong> Solicita acceso aquí</strong></a>
    </div>

  </div>

</div>
